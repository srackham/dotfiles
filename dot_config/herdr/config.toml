onboarding = false

[theme]
name = "terminal"
auto_switch = false

[keys]
prefix = ["alt+b", "ctrl+b"]
switch_workspace = ["alt+1..9"]
next_workspace = ["alt+down"]
previous_workspace = ["alt+up"]
switch_tab = ["prefix+1..9", "ctrl+shift+1..9"]
next_tab = ["prefix+n", "ctrl+shift+n"]
previous_tab = ["prefix+p", "ctrl+shift+p"]
cycle_pane_next = ["prefix+tab", "alt+n"]
cycle_pane_previous = ["prefix+shift+tab", "alt+p"]
zoom = ["prefix+z", "alt+f"]

[ui]
tab_bar_position = "bottom"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

[ui.sidebar.agents]
rows = [["workspace", "state_icon", "tab"]]

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-left"
