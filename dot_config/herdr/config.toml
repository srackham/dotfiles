onboarding = false

[theme]
name = "terminal"
auto_switch = false

[keys]
# prefix = ["ctrl+a", "ctrl+b", "ctrl+s"]
switch_workspace = ["alt+1..9"]
next_workspace = ["alt+n"]
previous_workspace = ["alt+p"]
switch_tab = ["ctrl+shift+1..9"]
next_tab = ["ctrl+shift+n"]
previous_tab = ["ctrl+shift+p"]
cycle_pane_next = ["alt+shift+n"]
cycle_pane_previous = ["alt+shift+p"]
zoom = ["prefix+z", "alt+z"]

[ui]
tab_bar_position = "bottom"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

[ui.sidebar.agents]
rows = [["workspace", "state_icon", "tab"]]
